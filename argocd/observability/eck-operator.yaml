apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.elastic.co
      chart: eck-operator
      targetRevision: "3.5.0"
      helm:
        releaseName: eck-operator
        valueFiles:
          - $values/observability/eck/values.yaml

    - repoURL: https://github.com/Zenitugo/orderly-platform.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true