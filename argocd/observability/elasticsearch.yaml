apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderly-elasticsearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Zenitugo/orderly-platform.git
    targetRevision: master
    path: observability/elasticsearch
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true