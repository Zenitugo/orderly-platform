apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderly-elasticsearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Zenitugo/orderly-platform.git
    targetRevision: master
    path: observability/elasticsearch
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring


  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m