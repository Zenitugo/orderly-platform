apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderly-api-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Zenitugo/orderly-platform.git
    targetRevision: HEAD
    path: helm-api-gateway
    helm:
      releaseName: api-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: orderly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true