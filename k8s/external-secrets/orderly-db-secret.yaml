apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orderly-db-secret
  namespace: orderly
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: orderly-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ${SECRET_ARN}
        property: username
    - secretKey: password
      remoteRef:
        key: ${SECRET_ARN}
        property: password