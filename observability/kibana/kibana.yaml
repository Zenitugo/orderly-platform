apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: orderly-kibana
  namespace: monitoring
spec:
  version: 9.2.0
  count: 1
  elasticsearchRef:
    name: orderly-elasticsearch
  podTemplate:
    spec:
      nodeSelector:
        workload: observability
      containers:
        - name: kibana
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi