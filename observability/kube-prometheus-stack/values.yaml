
grafana:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 24h
    storageSpec: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
