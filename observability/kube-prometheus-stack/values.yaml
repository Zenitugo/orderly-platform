
grafana:
  enabled: true
  nodeSelector:
    workload: observability
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 24h
    storageSpec: {}
    nodeSelector:
      workload: observability
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
