kind: DaemonSet
nodeSelector:
  workload: application
rbac:
  create: true

serviceAccount:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host orderly-elasticsearch-es-http.monitoring.svc
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        tls On
        tls.verify On
        tls.ca_file /fluent-bit/tls/ca.crt
        Logstash_Format On
        Logstash_Prefix orderly
        Retry_Limit False

env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: orderly-elasticsearch-es-elastic-user
        key: elastic

extraVolumes:
  - name: elasticsearch-ca
    secret:
      secretName: orderly-elasticsearch-es-http-certs-public

extraVolumeMounts:
  - name: elasticsearch-ca
    mountPath: /fluent-bit/tls
    readOnly: true