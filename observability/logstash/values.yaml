replicas: 1

logstashConfig:
  logstash.yml: |
    http.host: 0.0.0.0
    xpack.monitoring.enabled: false

nodeSelector:
  workload: observability

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    cpu: "1"
    memory: 2Gi

logstashJavaOpts: "-Xms768m -Xmx768m"

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 120
  timeoutSeconds: 10
  failureThreshold: 6 

extraEnvs:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: orderly-elasticsearch-es-elastic-user
        key: elastic

extraVolumes:
  - name: logstash-pipeline
    configMap:
      name: orderly-logstash-pipeline
  - name: elasticsearch-ca
    secret:
      secretName: orderly-elasticsearch-es-http-certs-public

extraVolumeMounts:
  - name: logstash-pipeline
    mountPath: /usr/share/logstash/pipeline/logstash.conf
    subPath: logstash.conf
    readOnly: true
  - name: elasticsearch-ca
    mountPath: /usr/share/logstash/config/certs
    readOnly: true

extraPorts:
  - name: beats
    containerPort: 5044
    protocol: TCP

service:
  type: ClusterIP
  ports:
    - name: beats
      port: 5044
      protocol: TCP
      targetPort: 5044