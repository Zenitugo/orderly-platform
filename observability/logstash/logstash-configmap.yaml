apiVersion: v1
kind: ConfigMap
metadata:
  name: orderly-logstash-pipeline
  namespace: monitoring
data:
  logstash.conf: |
    input {
      tcp {
        port => 5044
        codec => json_lines
      }
     }

    # filter {
  

    
    filter {
      ruby {
        code => '
          labels = event.get("[kubernetes][labels]")

          if labels.is_a?(Hash)
            normalized_labels = {}

            labels.each do |key, value|
              safe_key = key.to_s.gsub(/[.\/]/, "_")
              normalized_labels[safe_key] = value
            end

            event.set("[kubernetes][labels]", normalized_labels)
          end
        '
      }

      if [kubernetes][namespace_name] == "orderly" {
        mutate {
          add_field => {
            "environment" => "orderly"
          }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["https://orderly-elasticsearch-es-http.monitoring.svc:9200"]
        user => "elastic"
        password => "${ES_PASSWORD}"

        ssl => true
        cacert => "/usr/share/logstash/config/certs/ca.crt"

        index => "orderly-logs-v2-%{+YYYY.MM.dd}"
      }
    }