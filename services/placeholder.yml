name: orderly

services:
  # --- infra ---

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderly
      POSTGRES_USER: orderly
      POSTGRES_PASSWORD: orderly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderly"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC, exposed for local debugging/manual sends
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # dev only, never do this past local
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- app services ---

  api-gateway:
    build: ./services/api-gateway
    environment:
      SERVICE_NAME: api-gateway
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDERS_CREATED: orders.created
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  order-worker:
    build: ./services/order-worker
    environment:
      SERVICE_NAME: order-worker
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDERS_CREATED: orders.created
      KAFKA_TOPIC_ORDERS_COMPLETED: orders.completed
      KAFKA_CONSUMER_GROUP: order-worker
      POSTGRES_DSN: "host=postgres port=5432 dbname=orderly user=orderly password=orderly"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      METRICS_PORT: "9100"
      SIMULATED_FAILURE_RATE: "0.1"
    ports:
      - "9100:9100"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  notifier:
    build: ./services/notifier
    environment:
      SERVICE_NAME: notifier
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_ORDERS_COMPLETED: orders.completed
      KAFKA_CONSUMER_GROUP: notifier
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      METRICS_PORT: "9200"
    ports:
      - "9200:9200"
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
  grafana_data: