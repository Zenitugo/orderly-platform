#################  Github Actions CD Pipeline for Orderly #############################

name: Platform
on:
  workflow_dispatch:

env:  
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_REGION: eu-central-1

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v6


        - name: Install Kubectl
          uses: azure/setup-kubectl@v4


        - name: Install helm
          uses: azure/setup-helm@v5.0.0
          with:
            version-file: .tool-versions
          id: install


        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3


        - name: Update linux with eks config
          run: aws eks update-kubeconfig --region eu-central-1 --name Orderly_Cluster


        - name: Create namespace
          run: |
           kubectl create namespace orderly --dry-run=client -o yaml | kubectl apply -f -
           kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -
           kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

        - name: Create a gp3 csi storage class
          run: |
            kubectl apply -f k8s/storage/gp3-storageclass.yaml

        - name: Add External Secrets Helm Repository
          run: |
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update

            
        - name: Install External Secrets Operator
          run: |
            helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets

        
        - name: Apply ClusterSecretStore
          run: |
            cd k8s/external-secrets
            kubectl apply -f cluster-secret-store.yaml

        - name: Reterive Secret and store in variable
          id: secret-arn
          run: |
            cd terraform/prod
            terraform init
            SECRET_ARN=$(terraform output -raw db_secretarn)
            echo "secret_arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"


            aws secretsmanager get-secret-value \
              --secret-id "$SECRET_ARN" \
              --region eu-central-1 \
              --query 'SecretString' \
              --output text | jq 'keys'

        - name: Apply ExternalSecret
          env:
            SECRET_ARN: ${{ steps.secret-arn.outputs.secret_arn }}
          run: |
            envsubst '${SECRET_ARN}' < k8s/external-secrets/orderly-db-secret.yaml | kubectl apply -f -

        - name: Wait for ExternalSecret
          run: |
            kubectl wait \
              --for=condition=Ready \
              externalsecret/orderly-db-secret \
              -n orderly \
              --timeout=120s

        - name: Apply ClusterParameterStore
          run: |
            kubectl apply -f k8s/external-secrets/cluster-parameter-store.yaml

        - name: Apply Database  Credentials
          run: |  
            kubectl apply -f k8s/external-secrets/orderly-db-parameters.yaml

        - name: Apply StorageClass
          run: |
            kubectl apply -f k8s/storage/gp3-storageclass.yaml

        - name: Add kafka Helm Repository
          run: |
              helm repo add helmforge https://repo.helmforge.dev
              helm repo update

        - name: Install Kafka
          run: |
              helm upgrade --install kafka helmforge/kafka \
              --namespace orderly \
              --set architecture=single-broker \
              --set image.repository=apache/kafka \
              --set singleBroker.persistence.enabled=true \
              --set singleBroker.persistence.storageClass=gp3-csi \
              --set singleBroker.persistence.size=8Gi \
              --wait \
              --timeout 15m

        - name: Ensure Kafka topics exist
          run: |
            set -euo pipefail

            kubectl rollout status statefulset/kafka-kafka \
              -n orderly --timeout=180s

            kubectl exec -n orderly kafka-kafka-0 -- \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create \
              --if-not-exists \
              --topic orders.completed \
              --partitions 1 \
              --replication-factor 1

            kubectl exec -n orderly kafka-kafka-0 -- \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --create --if-not-exists \
              --topic orders.created \
              --partitions 1 \
              --replication-factor 1

              
        - name: Add ArgoCD Helm Repository
          run: |
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update


        - name: Install Argo CD
          run: |
            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd \
              --set server.service.type=ClusterIP \
              --wait \
              --timeout 10m   
              
        - name: Wait for Argo CD Application CRD
          run: |
            kubectl wait \
              --for=condition=Established \
              --timeout=120s \
              crd/applications.argoproj.io

