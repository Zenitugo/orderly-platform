#################  Github Actions CD Pipeline for Orderly #############################

name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
        - completed

env:  
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_REGION: eu-central-1

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v6


        - name: Install Kubectl
          uses: azure/setup-kubectl@v4


        - name: Install helm
          uses: azure/setup-helm@v5.0.0
          with:
            version-file: .tool-versions
          id: install


        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3


        - name: Update linux with eks config
          run: aws eks update-kubeconfig --region eu-central-1 --name Orderly_Cluster


        - name: Create namespace
          run: |
           kubectl create namespace orderly --dry-run=client -o yaml | kubectl apply -f -
           kubectl create namespace external-secrets --dry-run=client -o yaml | kubectl apply -f -


        - name: Add External Secrets Helm Repository
          run: |
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update

            
        - name: Install External Secrets Operator
          run: |
            helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets


        - name: Install Api Gateway Helm Chart
          run: |
           helm upgrade --install api-gateway ./api-gateway -n orderly \
           --set-string image.repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/orderly-apigateway"
           

        - name: Install Order-worker Helm Chart
          run: |
           helm upgrade --install order-worker ./order-worker -n orderly \
           --set-string image.repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/orderly-orderworker"

        - name: Install Notifier Helm Chart
          run: |
            helm upgrade --install notifier ./notifier -n orderly \
             --set-string image.repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/orderly-notifier"

        
        - name: Apply ClusterSecretStore
          run: |
            cd k8s/external-secrets
            kubectl apply -f cluster-secret-store.yaml

        - name: Reterive Secret and store in variable
          run: |
            cd terraform/prod
            SECRET_ARN=$(terraform output -raw db_secretarn)

        - name: Create External Secret from the secret created by AWS Secrets Manager
          run: |
            aws secretsmanager get-secret-value \
              --secret-id "$SECRET_ARN" \
              --region eu-central-1 \
              --query 'SecretString' \
              --output text | jq 'fromjson | keys'

