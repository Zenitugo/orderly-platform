
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  update-helm-values:
    name: Update Helm image values
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit built by Platform
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      
      - name: Install Argo CD CLI
        uses: clowdhaus/argo-cd-action@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
        with:
          command: version
          options: --client

      - name: EKS access
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name Orderly_Cluster \
            --region eu-central-1
        
      - name: Retrieve ECR repository URIs from SSM
        id: ecr
        shell: bash
        run: |  
            set -euo pipefail

            cd terraform/prod
            terraform init

            echo "api_gateway=$(terraform output -raw api_gateway_repo)" >> "$GITHUB_OUTPUT"
            echo "order_worker=$(terraform output -raw order_worker_repo)" >> "$GITHUB_OUTPUT"
            echo "notifier=$(terraform output -raw notifier_repo)" >> "$GITHUB_OUTPUT"
            echo "frontend=$(terraform output -raw frontend_repo)" >> "$GITHUB_OUTPUT"

      - name: Login to ArgoCD Applications
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail
          
          kubectl port-forward \
            svc/argocd-server \
            8081:443 \
            -n argocd \
            > /tmp/argocd-port-forward.log 2>&1 &

          echo $! > /tmp/argocd-port-forward.pid

          for i in {1..30}; do
            if curl -ks https://localhost:8081/healthz >/dev/null; then
              echo "ArgoCD is reachable"
              break
            fi

            if ! kill -0 "$(cat /tmp/argocd-port-forward.pid)" 2>/dev/null; then
              echo "Port-forward process exited:"
              cat /tmp/argocd-port-forward.log
              exit 1
            fi

            if [ "$i" -eq 30 ]; then
              echo "Argo CD server did not become reachable:"
              cat /tmp/argocd-port-forward.log
              exit 1
            fi
            sleep 2
          done

          argocd login "$ARGOCD_SERVER" \
            --username admin \
            --password "$PASSWORD" \
            --grpc-web \
            --insecure

      - name: Register Argo CD application
        run: |
            kubectl apply -f argocd/apps/


      - name: Register and sync Prometheus and Grafana
        run: |
          set -euo pipefail

          kubectl apply -f argocd/observability/kube-prometheus-stack.yaml

          argocd app sync kube-prometheus-stack

          argocd app wait kube-prometheus-stack \
            --sync \
            --health \
            --timeout 600


      - name: Diagnose Argo CD permissions
        run: |
          set -euo pipefail

          argocd account get-user-info
          argocd app get orderly-api-gateway

      - name: Mask ECR image URIs
        env:
          API_GATEWAY_URI: ${{ steps.ecr.outputs.api_gateway }}
          ORDER_WORKER_URI: ${{ steps.ecr.outputs.order_worker }}
          NOTIFIER_URI: ${{ steps.ecr.outputs.notifier }}
          FRONTEND_URI: ${{ steps.ecr.outputs.frontend }}
        run: |
          echo "::add-mask::$API_GATEWAY_URI"
          echo "::add-mask::$ORDER_WORKER_URI"
          echo "::add-mask::$NOTIFIER_URI"
          echo "::add-mask::$FRONTEND_URI"

      - name: Set ECR Registries on ArgoCD Applications
        env:
          API_GATEWAY_URI: ${{ steps.ecr.outputs.api_gateway }}
          ORDER_WORKER_URI: ${{ steps.ecr.outputs.order_worker }}
          NOTIFIER_URI: ${{ steps.ecr.outputs.notifier }}
          FRONTEND_URI: ${{ steps.ecr.outputs.frontend }}
        run: | 
          argocd app set orderly-api-gateway \
            --helm-set-string image.repository="$API_GATEWAY_URI"

          argocd app set orderly-order-worker \
            --helm-set-string image.repository="$ORDER_WORKER_URI"

          argocd app set orderly-notifier \
            --helm-set-string image.repository="$NOTIFIER_URI"

          argocd app set orderly-frontend \
            --helm-set-string image.repository="$FRONTEND_URI"
